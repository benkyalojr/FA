# nginx site for SNAPerp on erp.werevu.co.ke  (PHP 8.2-FPM, Let's Encrypt via Certbot)
# Install:  /etc/nginx/sites-available/snaperp  ->  symlink into sites-enabled, remove the old
# erp.werevu.co.ke server blocks, then:  nginx -t && systemctl reload nginx
#
# Cloudflare: use SSL/TLS mode "Full (strict)". This file redirects http -> https at the origin,
# which loops under "Flexible".

# ---------------------------------------------------------------- http -> https
server {
    listen 80;
    listen [::]:80;
    server_name erp.werevu.co.ke;

    location /.well-known/acme-challenge/ { root /var/www/html; }   # Certbot renewals
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------- https
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.werevu.co.ke;

    ssl_certificate     /etc/letsencrypt/live/erp.werevu.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.werevu.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bentito/snaperp;
    index index.php;

    client_max_body_size 20M;          # uploads (attachments, item pictures)
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/snaperp.access.log;
    error_log  /var/log/nginx/snaperp.error.log;

    # ---- generated JavaScript and uploaded images are public ----------------------
    # Listed first: among regex locations nginx uses the first match, so these win over the
    # deny rules below. (No nesting - plain, flat locations behave the same on every nginx.)
    location ~ ^/company/[0-9]+/(images|js_cache)/.+\.(js|css|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Generated report PDFs: FrontAccounting links straight to company/<n>/pdf_files/<random>.pdf
    # (the random name is the access control, as on Apache), so the browser must be able to fetch them.
    location ~ ^/company/[0-9]+/pdf_files/[A-Za-z0-9_.-]+\.pdf$ {
        try_files $uri =404;
        add_header Cache-Control "private, no-store";
    }

    # ---- never serve source, config, logs, backups or keys ------------------
    # (Apache gets this from .htaccess; nginx ignores .htaccess.)
    location ~* \.(inc|po|sh|sql|log|pem|key|bak|md|dist|example)$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(sql|scripts|cron|deploy|lang|doc|tests|install/lang)/.*\.(php|inc|sql|log|txt|csv|json)$ { deny all; }
    location ~ ^/(config|config_db|config\.default|installed_extensions|version)\.php$ { deny all; }
    # everything else under company/ (attachments, PDFs, backups, the M-Pesa key) is private
    location /company/ { deny all; }
    location /tmp/ { deny all; }
    location /backups/ { deny all; }

    # ---- mobile / REST API ----------------------------------------------------
    location ^~ /api/storage/ {
        alias /var/www/bentito/snaperp/api/storage/;
        add_header Cache-Control "private, max-age=86400";
    }
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/bentito/snaperp/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 60s;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    # ---- the app ----------------------------------------------------------------
    # Unknown paths fall back to index.php, which serves public invoice links
    # (/share/invoice/<token>) before any login check.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 90s;      # eTIMS calls can take up to 30 s (login may add another)
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---- static assets ------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }
}
